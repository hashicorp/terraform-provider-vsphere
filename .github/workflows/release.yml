---
name: Release

on:
  push:
    tags:
      - 'v*.*.*'    # Match stable releases. e.g. v1.2.3
      - 'v*.*.*-*'  # Match pre-releases. e.g. v1.2.3-beta, v1.2.3-rc.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Generate Release Notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/}"
          bash scripts/release-notes.sh "$version"
          test -s RELEASE_NOTES.md || { echo "ERROR: RELEASE_NOTES.md missing or empty"; exit 1; }
          echo "Previewing (first 40 lines):"
          sed -n '1,40p' RELEASE_NOTES.md
      - name: Import GPG Key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: >
            release
            --clean
            --timeout 60m
            --release-header-tmpl .goreleaser.tmpl
            --release-notes RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
